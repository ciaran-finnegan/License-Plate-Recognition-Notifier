name: Deploy Python Lambda Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-lambda-deployment
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11

      - name: Create deployment package
        run: |
          set -euo pipefail
          rm -rf package deployment-package.zip deployment-package.zip.sha256
          mkdir package
          python -m pip install --requirement requirements.txt --target package
          cp /usr/lib/x86_64-linux-gnu/libjpeg.so.8 package/libjpeg.so.8
          (
            cd package
            zip -qr ../deployment-package.zip .
          )
          zip -q deployment-package.zip lambda_function.py
          sha256sum deployment-package.zip > deployment-package.zip.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-deployment-package
          path: |
            deployment-package.zip
            deployment-package.zip.sha256
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: production

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          : "${AWS_ROLE_ARN:?AWS_ROLE_ARN must be set}"
          : "${AWS_REGION:?AWS_REGION must be set}"
          : "${AWS_LAMBDA_FUNCTION_NAME:?AWS_LAMBDA_FUNCTION_NAME must be set}"

          [[ "$AWS_ROLE_ARN" =~ ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$ ]] || {
            printf '%s\n' 'AWS_ROLE_ARN has an invalid role ARN form' >&2
            exit 1
          }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$ ]] || {
            printf '%s\n' 'AWS_REGION has an invalid region form' >&2
            exit 1
          }
          [[ "$AWS_LAMBDA_FUNCTION_NAME" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || {
            printf '%s\n' 'AWS_LAMBDA_FUNCTION_NAME has an invalid function name form' >&2
            exit 1
          }

      - name: Guard current main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$EXPECTED_SHA" != "$current_main_sha" ]]; then
            printf 'Refusing deployment: run SHA %s is not current main %s\n' \
              "$EXPECTED_SHA" "$current_main_sha" >&2
            exit 1
          fi

      - name: Download deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-deployment-package
          path: deployment-artifact

      - name: Verify deployment artifact
        run: |
          set -euo pipefail
          cd deployment-artifact
          test -f deployment-package.zip
          test -f deployment-package.zip.sha256
          sha256sum --check deployment-package.zip.sha256

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-lambda-deploy

      - name: Deploy to Lambda
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$AWS_LAMBDA_FUNCTION_NAME" \
            --zip-file "fileb://deployment-artifact/deployment-package.zip" \
            --region "$AWS_REGION"
