name: Deploy Python Lambda Function

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: 3.11

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-lambda-deploy

      - name: Install AWS CLI
        run: |
          pip3 install awscli
          aws --version

      - name: Create Deployment Package
        run: |
          mkdir package
          pip3 install -r requirements.txt --target ./package
          # Copy libjpeg.so.8 from the Ubuntu system directory
          cp /usr/lib/x86_64-linux-gnu/libjpeg.so.8 ./package/libjpeg.so.8
          cd package
          zip -r ../deployment-package.zip .
          cd ..
          zip deployment-package.zip lambda_function.py

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://deployment-package.zip \
            --region "${{ vars.AWS_REGION }}"
