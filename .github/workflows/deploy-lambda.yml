name: Deploy Python Lambda Function

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-lambda-deploy

      - name: Install AWS CLI
        run: |
          pip3 install awscli
          aws --version

      - name: Create Deployment Package
        run: |
          mkdir package
          pip3 install -r requirements.txt --target ./package
          # Copy libjpeg.so.8 from the Ubuntu system directory
          cp /usr/lib/x86_64-linux-gnu/libjpeg.so.8 ./package/libjpeg.so.8
          cd package
          zip -r ../deployment-package.zip .
          cd ..
          zip deployment-package.zip lambda_function.py

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://deployment-package.zip \
            --region "${{ vars.AWS_REGION }}"
